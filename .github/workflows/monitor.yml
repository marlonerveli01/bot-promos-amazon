name: Automação Promos Amazon

on:
  schedule:
    # Roda a cada 30 minutos, todos os dias
    - cron: '*/30 * * * *'
  # Permite rodar manualmente para testar
  workflow_dispatch:

permissions:
  # Essencial para salvar o histórico no arquivo posted_deals.txt
  contents: write

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        #requests: para enviar para o Telegram, feedparser: para ler o feed
        run: pip install requests feedparser

      - name: Executar robô Amazon
        env:
          # Segredos que você configurou no GitHub Settings
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python main.py

      - name: Salvar histórico (posted_deals.txt)
        # Salva as alterações no arquivo de texto para não repetir posts
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          touch posted_deals.txt
          git add posted_deals.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza histórico [skip ci]" && git push)
